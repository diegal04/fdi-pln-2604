[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdi-pln-2604-p5"
version = "1.0"
description = "Practica 5 de PLN: Transformer causal y NER"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "torch",
]

[project.scripts]
fdi-pln-2604-p5 = "main:cli"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "attention",
    "causalLLM",
    "main",
    "ner",
    "tokenizer",
    "train",
    "transformer",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
